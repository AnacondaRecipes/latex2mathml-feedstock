{% set name = "latex2mathml" %}
{% set version = "3.77.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: e2f501d1878f2e489c3f6f12786bef74c62f712d2770f7f3c837eb20a55d0a1e

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - latex2mathml = latex2mathml.converter:main
    - l2m = latex2mathml.converter:main

requirements:
  host:
    - python
    - poetry-core
    - pip
  run:
    - python

test:
  imports:
    - latex2mathml
    - latex2mathml.converter
  commands:
    - pip check
    - latex2mathml -V
    - l2m -V
    - python -c "from latex2mathml.converter import convert; assert '<mi>x</mi>' in convert('x')"
  requires:
    - pip

about:
  home: https://github.com/roniemartinez/latex2mathml
  summary: Pure Python library for LaTeX to MathML conversion
  description: A pure Python converter from LaTeX mathematical expressions to MathML.
  license: MIT AND LPPL-1.3c
  license_family: Other
  license_file:
    - LICENSE
    - latex2mathml/unimathsymbols.txt
  doc_url: https://github.com/roniemartinez/latex2mathml/blob/master/README.md
  dev_url: https://github.com/roniemartinez/latex2mathml

extra:
  recipe-maintainers:
    - '0xbe7a'
